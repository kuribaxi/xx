// ------------------- HELPER (ES5) -------------------
function cloneChannel(ch, subgroupKey) {
  var copy = { name: ch.name, url: ch.url, icon: ch.icon };
  if (ch.color) copy.color = ch.color;
  copy.subgroup = subgroupKey;
  return copy;
}

function buildTelewebionFlat() {
  var flat = [];
  for (var i = 0; i < subgroupsData.telewebion.length; i++) {
    var sg = subgroupsData.telewebion[i];
    for (var j = 0; j < sg.channels.length; j++) {
      flat.push(cloneChannel(sg.channels[j], sg.key));
    }
  }
  return flat;
}

function loadOrder(cat) {
  try { var o = localStorage.getItem('order_' + cat); return o ? JSON.parse(o) : null; } catch(e){ return null; }
}
function saveOrder(cat, arr) {
  var urls = [];
  for (var i=0;i<arr.length;i++) urls.push(arr[i].url);
  localStorage.setItem('order_' + cat, JSON.stringify(urls));
}
function applyStoredOrder(flat, catKey) {
  var stored = loadOrder(catKey);
  if (!stored || !stored.length) return flat;
  var map = {};
  for (var i=0;i<flat.length;i++) map[flat[i].url] = flat[i];
  var ordered = [];
  for (var si=0;si<stored.length;si++) {
    var u = stored[si];
    if (map[u]) ordered.push(map[u]);
  }
  for (var fi=0;fi<flat.length;fi++) {
    if (ordered.indexOf(flat[fi]) === -1) ordered.push(flat[fi]);
  }
  return ordered;
}

// ------------------- DETECT OLD iOS -------------------
function isOldIOS() {
  var ua = navigator.userAgent || '';
  var isIPhone = /iPhone|iPad|iPod/.test(ua);
  if (!isIPhone) return false;
  var match = ua.match(/OS (\d+)_/);
  if (match && match[1]) {
    var major = parseInt(match[1], 10);
    return major <= 12;
  }
  return (screen.width <= 640 && screen.height <= 1136);
}

// ------------------- RENDER (ES5) -------------------
function escapeHtml(str) {
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

function render(filter, sgFilter) {
  curFilter = filter; curSubgroup = sgFilter;
  var html = '';
  if (filter === 'telewebion' || (!filter)) {
    var catArr = channels.telewebion;
    var sgMap = {};
    for (var idx=0; idx<subgroupsData.telewebion.length; idx++) {
      var sgk = subgroupsData.telewebion[idx].key;
      sgMap[sgk] = { label: subgroupsData.telewebion[idx].label, items: [] };
    }
    for (var i=0; i<catArr.length; i++) {
      var ch = catArr[i];
      var sgKey = ch.subgroup || 'sarasari';
      if (sgMap[sgKey]) sgMap[sgKey].items.push({ch: ch, idx: i});
    }
    if (sgFilter) {
      var sgObj = sgMap[sgFilter];
      if (sgObj && sgObj.items.length) {
        html += '<div class="category-title">' + sgObj.label + ' (' + sgObj.items.length + ')</div>';
        for (var it=0; it<sgObj.items.length; it++) {
          html += makeChannelItem(sgObj.items[it].ch, sgObj.items[it].idx, 'telewebion');
        }
      }
    } else {
      html += '<div class="category-title">📡 Telewebion (' + catArr.length + ')</div>';
      for (var sg in sgMap) {
        if (sgMap[sg].items.length > 0) {
          html += '<div class="subgroup-title">' + sgMap[sg].label + '</div>';
          for (var it2=0; it2<sgMap[sg].items.length; it2++) {
            html += makeChannelItem(sgMap[sg].items[it2].ch, sgMap[sg].items[it2].idx, 'telewebion');
          }
        }
      }
    }
  }
  if ((filter === 'ifilm' || (!filter)) && !sgFilter) {
    var ifArr = channels.ifilm;
    html += '<div class="category-title">🎬 iFilm (' + ifArr.length + ')</div>';
    for (var ii=0; ii<ifArr.length; ii++) {
      html += makeChannelItem(ifArr[ii], ii, 'ifilm');
    }
  }
  document.getElementById('ch-container').innerHTML = html;
  attachDragListeners();
  attachChannelEvents();
}

function makeChannelItem(ch, idx, catKey) {
  var star = favs.some(function(f) { return f.url === ch.url; }) ? '⭐' : '☆';
  var activeClass = (cur && cur.url === ch.url) ? 'active' : '';
  var colorCls = ch.color || '';
  var iconSpan = ch.icon ? ch.icon + ' ' : '';
  return '<div class="channel-item ' + colorCls + ' ' + activeClass + '" draggable="true" data-url="' + escapeHtml(ch.url) + '" data-name="' + escapeHtml(ch.name) + '" data-cat="' + catKey + '" data-idx="' + idx + '">' +
    '<span>' + iconSpan + ch.name + '</span>' +
    '<button class="fav-btn" data-url="' + escapeHtml(ch.url) + '" data-name="' + escapeHtml(ch.name) + '">' + star + '</button>' +
    '</div>';
}

function attachChannelEvents() {
  var items = document.querySelectorAll('.channel-item');
  for (var i=0; i<items.length; i++) {
    var el = items[i];
    el.addEventListener('click', function(ev) {
      if (ev.target.classList && ev.target.classList.contains('fav-btn')) return;
      var url = this.getAttribute('data-url');
      var name = this.getAttribute('data-name');
      play(url, name, '');
    });
    var favBtn = el.querySelector('.fav-btn');
    if (favBtn) {
      favBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        var url = this.getAttribute('data-url');
        var name = this.getAttribute('data-name');
        fav(url, name);
      });
    }
  }
}

// Drag and drop (ES5)
function attachDragListeners() {
  var draggables = document.querySelectorAll('.channel-item[draggable="true"]');
  for (var i=0; i<draggables.length; i++) {
    var el = draggables[i];
    el.addEventListener('dragstart', dragStart);
    el.addEventListener('dragend', dragEnd);
    el.addEventListener('dragover', dragOver);
    el.addEventListener('dragleave', dragLeave);
    el.addEventListener('drop', drop);
  }
}
function dragStart(e) {
  dragSource = e.target.closest('.channel-item');
  if (!dragSource) return;
  e.dataTransfer.setData('text/plain', 'drag');
  e.dataTransfer.effectAllowed = 'move';
  dragSource.style.opacity = '0.5';
}
function dragEnd() { if(dragSource) dragSource.style.opacity = ''; cleanupDragOver(); dragSource = null; }
function dragOver(e) { e.preventDefault(); var target = e.target.closest('.channel-item'); if(target && target !== dragSource) target.classList.add('drag-over'); }
function dragLeave(e) { var target = e.target.closest('.channel-item'); if(target) target.classList.remove('drag-over'); }
function drop(e) {
  e.preventDefault();
  var targetItem = e.target.closest('.channel-item');
  if(!dragSource || !targetItem || dragSource === targetItem) { cleanupDragOver(); return; }
  var srcCat = dragSource.getAttribute('data-cat');
  var tgtCat = targetItem.getAttribute('data-cat');
  if(srcCat !== tgtCat) { cleanupDragOver(); return; }
  var srcIdx = parseInt(dragSource.getAttribute('data-idx'), 10);
  var tgtIdx = parseInt(targetItem.getAttribute('data-idx'), 10);
  if(isNaN(srcIdx) || isNaN(tgtIdx)) { cleanupDragOver(); return; }
  var arr = channels[srcCat].slice();
  var moved = arr[srcIdx];
  arr.splice(srcIdx, 1);
  arr.splice(tgtIdx, 0, moved);
  reorderCategory(srcCat, arr);
  render(curFilter, curSubgroup);
  cleanupDragOver();
}
function cleanupDragOver() { var all = document.querySelectorAll('.channel-item'); for(var i=0;i<all.length;i++) all[i].classList.remove('drag-over'); }
function reorderCategory(catKey, newArr) { channels[catKey] = newArr; saveOrder(catKey, newArr); }

// ---------- PLAYBACK ----------
function destroyPlayers() {
  if(stallTimer) clearInterval(stallTimer);
  if(keepAliveTimer) clearInterval(keepAliveTimer);
  if(retryTimer) clearTimeout(retryTimer);
  if(hlsInst) { try { hlsInst.destroy(); } catch(e){} hlsInst = null; }
}
function playNative(url, name) {
  var wrap = document.getElementById('vwrap');
  var vid = document.getElementById('vplayer');
  if(!vid) {
    wrap.innerHTML = '<video id="vplayer" controls autoplay playsinline style="width:100%;height:100%;"></video>';
    vid = document.getElementById('vplayer');
  }
  vid.src = url;
  vid.play().catch(function(e){ console.warn(e); scheduleRetry(url, name); });
}
function scheduleRetry(url, name) {
  if(retryTimer) clearTimeout(retryTimer);
  retryTimer = setTimeout(function() {
    if(cur && cur.url === url) playInternal(url, name);
  }, 3000);
}
function playInternal(url, name) {
  var wrap = document.getElementById('vwrap');
  if(!jsEnabled || !window.Hls || !Hls.isSupported() || isOldIOS()) {
    playNative(url, name);
    return;
  }
  var vid = document.getElementById('vplayer');
  if(!vid) {
    wrap.innerHTML = '<video id="vplayer" controls autoplay playsinline style="width:100%;height:100%;"></video>';
    vid = document.getElementById('vplayer');
  }
  if(hlsInst) try { hlsInst.destroy(); } catch(e){}
  hlsInst = new Hls({ enableWorker: false, maxBufferLength: 30 });
  hlsInst.loadSource(url);
  hlsInst.attachMedia(vid);
  hlsInst.on(Hls.Events.MANIFEST_PARSED, function() { vid.play().catch(function(){}); });
  hlsInst.on(Hls.Events.ERROR, function(_, data) {
    if(data.fatal) scheduleRetry(url, name);
  });
}
function play(url, name, referer) {
  if(window.innerWidth <= 768) document.getElementById('channel-list').classList.remove('show');
  cur = { url: url, name: name };
  document.getElementById('ch-title').innerHTML = name;
  destroyPlayers();
  var wrap = document.getElementById('vwrap');
  wrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;"><div class="spinner"></div><span>Laddar ' + name + '…</span></div>';
  render(curFilter, curSubgroup);
  setTimeout(function() { playInternal(url, name); }, 50);
}

function toggleJSengine() {
  jsEnabled = !jsEnabled;
  var btn = document.getElementById('jsToggleBtn');
  btn.innerHTML = jsEnabled ? '⚙️ JS PÅ' : '⚠️ JS AV';
  btn.classList.toggle('js-toggle-off', !jsEnabled);
  localStorage.setItem('xom_js_toggle', jsEnabled ? 'on' : 'off');
  if(cur) play(cur.url, cur.name, '');
}
function toggleList() { document.getElementById('channel-list').classList.toggle('show'); }
function fav(url, name) {
  var idx = -1;
  for(var i=0;i<favs.length;i++) if(favs[i].url === url) { idx = i; break; }
  if(idx > -1) favs.splice(idx,1);
  else favs.push({url:url, name:name});
  localStorage.setItem('xomfavs', JSON.stringify(favs));
  render(curFilter, curSubgroup);
}
function reload() { if(cur) play(cur.url, cur.name, ''); }
function pip() { var v=document.getElementById('vplayer'); if(v && document.pictureInPictureEnabled) { document.pictureInPictureElement ? document.exitPictureInPicture() : v.requestPictureInPicture().catch(function(){}); } }
function fs() { var w=document.getElementById('vwrap'); document.fullscreenElement ? document.exitFullscreen() : w.requestFullscreen().catch(function(){}); }
function toggleTV() { tvMode=!tvMode; document.body.classList.toggle('tv-mode', tvMode); document.getElementById('tvBtn').innerHTML = tvMode ? '🖥️ Normal' : '📺 TV-läge'; if(tvMode && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){}); else if(document.fullscreenElement) document.exitFullscreen(); localStorage.setItem('xomtv', tvMode?'1':''); if(cur) reload(); }

// Filter functions
function showAll() { setActive(document.getElementById('btnAll')); curFilter=null; curSubgroup=null; render(null,null); }
function filterCat(cat) { setActive(document.getElementById('btnIfilm')); curFilter=cat; curSubgroup=null; render(cat,null); }
function filterSubgroup(sgKey, btnId) { setActive(document.getElementById(btnId)); curFilter='telewebion'; curSubgroup=sgKey; render('telewebion', sgKey); }
function setActive(btn) { var btns = document.querySelectorAll('.nav-btn'); for(var i=0;i<btns.length;i++) btns[i].classList.remove('active'); if(btn) btn.classList.add('active'); }

// INIT
(function() {
  try { favs = JSON.parse(localStorage.getItem('xomfavs') || '[]'); } catch(e){ favs=[]; }
  var oldDevice = isOldIOS();
  if(oldDevice) {
    jsEnabled = false;
    document.getElementById('compat-note').innerHTML = '⚠️ Äldre enhet: Native läge (JS AV)';
    localStorage.setItem('xom_js_toggle', 'off');
  } else {
    var savedJS = localStorage.getItem('xom_js_toggle');
    jsEnabled = savedJS !== 'off';
  }
  var jsBtn = document.getElementById('jsToggleBtn');
  jsBtn.innerHTML = jsEnabled ? '⚙️ JS PÅ' : '⚠️ JS AV';
  jsBtn.classList.toggle('js-toggle-off', !jsEnabled);
  if(localStorage.getItem('xomtv') === '1') { tvMode=true; document.body.classList.add('tv-mode'); document.getElementById('tvBtn').innerHTML = '🖥️ Normal'; }
  render(null,null);
  // Event listeners
  document.getElementById('btnAll').addEventListener('click', showAll);
  document.getElementById('btnSarasari').addEventListener('click', function(){ filterSubgroup('sarasari','btnSarasari'); });
  document.getElementById('btnOstani').addEventListener('click', function(){ filterSubgroup('ostani','btnOstani'); });
  document.getElementById('btnEkhtesasi').addEventListener('click', function(){ filterSubgroup('ekhtesasi','btnEkhtesasi'); });
  document.getElementById('btnRadio').addEventListener('click', function(){ filterSubgroup('radio','btnRadio'); });
  document.getElementById('btnIfilm').addEventListener('click', function(){ filterCat('ifilm'); });
  document.getElementById('toggleListBtn').addEventListener('click', toggleList);
  document.getElementById('closeListBtn').addEventListener('click', toggleList);
  document.getElementById('pipBtn').addEventListener('click', pip);
  document.getElementById('fsBtn').addEventListener('click', fs);
  document.getElementById('reloadBtn').addEventListener('click', reload);
  document.getElementById('tvBtn').addEventListener('click', toggleTV);
  document.getElementById('jsToggleBtn').addEventListener('click', toggleJSengine);
  document.getElementById('ua-select').addEventListener('change', function(){ if(cur) reload(); });
})();
</script>
