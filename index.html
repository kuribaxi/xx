<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Telewebion · iFilm</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  -webkit-overflow-scrolling:touch;
}

body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

.header{
  background:#1a1a1a;
  padding:12px;
  text-align:center;
}

.header h1{
  color:#4ecca3;
  font-size:22px;
}

.nav-buttons{
  display:flex;
  overflow-x:auto;
  gap:8px;
  padding:10px;
  background:#1b1b1b;
}

.nav-btn{
  flex-shrink:0;
  border:none;
  background:#2d2d2d;
  color:white;
  padding:8px 14px;
  border-radius:18px;
  font-size:13px;
}

.nav-btn.active{
  background:#4ecca3;
  color:black;
}

.container{
  display:flex;
  height:calc(100vh - 110px);
}

.channel-list{
  width:280px;
  overflow-y:auto;
  background:#1b1b1b;
}

.video-container{
  flex:1;
  display:flex;
  flex-direction:column;
  background:black;
}

.video-header{
  background:#181818;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.video-title{
  color:#4ecca3;
  font-weight:bold;
  font-size:16px;
}

.video-wrapper{
  flex:1;
  background:black;
}

video{
  width:100%;
  height:100%;
  background:black;
}

.category-title{
  padding:10px;
  color:#4ecca3;
  font-weight:bold;
  border-bottom:1px solid #333;
}

.channel-item{
  padding:12px;
  margin:6px;
  border-radius:12px;
  background:#2b2b2b;
  cursor:pointer;
  font-size:14px;
}

.channel-item:hover{
  background:#3b3b3b;
}

.channel-item.active{
  border:2px solid #4ecca3;
}

.btn{
  border:none;
  background:#2b2b2b;
  color:white;
  padding:7px 12px;
  border-radius:18px;
  margin-left:6px;
}

.error-msg{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

.spinner{
  width:28px;
  height:28px;
  border:4px solid rgba(255,255,255,0.2);
  border-top:4px solid #4ecca3;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:768px){

  .container{
    flex-direction:column;
  }

  .channel-list{
    width:100%;
    height:42%;
  }

  .video-container{
    height:58%;
  }
}

</style>
</head>

<body>

<div class="header">
  <h1>📡 Telewebion · iFilm</h1>
</div>

<div class="nav-buttons">

  <button class="nav-btn active"
  onclick="showAll(this)">
  Alla
  </button>

  <button class="nav-btn"
  onclick="filterCategory(this,'telewebion')">
  Telewebion
  </button>

  <button class="nav-btn"
  onclick="filterCategory(this,'ifilm')">
  iFilm
  </button>

</div>

<div class="container">

  <aside class="channel-list">
    <div id="channelContainer"></div>
  </aside>

  <main class="video-container">

    <div class="video-header">

      <div class="video-title"
      id="title">
      Välj kanal
      </div>

      <div>

        <button class="btn"
        onclick="reload()">
        ↻
        </button>

        <button class="btn"
        onclick="fullscreenPlayer()">
        ⛶
        </button>

      </div>

    </div>

    <div class="video-wrapper"
    id="playerWrap">

      <div class="error-msg">
        <h3>Välj en kanal</h3>
      </div>

    </div>

  </main>

</div>

<script>

const isiOS =
/iPad|iPhone|iPod/.test(navigator.userAgent);

let current = null;
let hls = null;
let currentFilter = null;

const channels = {

{name:'IRINN',url:'https://ncdn.telewebion.ir/irinn/live/playlist.m3u8'},
{name:'TV1+',url:'https://ncdn.telewebion.ir/tv1plus/live/playlist.m3u8'},
{name:'NAVA',url:'https://ncdn.telewebion.ir/nava/live/playlist.m3u8'},
{name:'NAMA',url:'https://ncdn.telewebion.ir/nama/live/playlist.m3u8'},

{name:'URMIA',url:'https://ncdn.telewebion.ir/azarbayjangharbi/live/playlist.m3u8'},
{name:'SAHAND',url:'https://ncdn.telewebion.ir/sahand/live/playlist.m3u8'},
{name:'ALBORZ',url:'https://ncdn.telewebion.ir/alborz/live/playlist.m3u8'},
{name:'ESFAHAN',url:'https://ncdn.telewebion.ir/esfahan/live/playlist.m3u8'},
{name:'SABALAN',url:'https://ncdn.telewebion.ir/sabalan/live/playlist.m3u8'},
{name:'ILAM',url:'https://ncdn.telewebion.ir/ilam/live/playlist.m3u8'},
{name:'BUSHEHR',url:'https://ncdn.telewebion.ir/bushehr/live/playlist.m3u8'},
{name:'JAHANBIN',url:'https://ncdn.telewebion.ir/jahanbin/live/playlist.m3u8'},

{name:'FARS',url:'https://ncdn.telewebion.ir/fars/live/playlist.m3u8'},
{name:'GHAZVIN',url:'https://ncdn.telewebion.ir/qazvin/live/playlist.m3u8'},
{name:'NOOR',url:'https://ncdn.telewebion.ir/noor/live/playlist.m3u8'},
{name:'LORESTAN',url:'https://ncdn.telewebion.ir/aflak/live/playlist.m3u8'},

{name:'AFTAB',url:'https://ncdn.telewebion.ir/aftab/live/playlist.m3u8'},
{name:'MAHABAD',url:'https://ncdn.telewebion.ir/mahabad/live/playlist.m3u8'},
{name:'HAMADAN',url:'https://ncdn.telewebion.ir/sina/live/playlist.m3u8'},
{name:'KHAVARAN',url:'https://ncdn.telewebion.ir/khavaran/live/playlist.m3u8'},

{name:'Radio Ava',url:'https://ncdn.telewebion.ir/radioava/live/playlist.m3u8'},
{name:'Radio Namayesh',url:'https://ncdn.telewebion.ir/radionamayesh/live/playlist.m3u8'},
{name:'Radio Tehran',url:'https://ncdn.telewebion.ir/radiotehran/live/playlist.m3u8'},
{name:'Radio Iran',url:'https://ncdn.telewebion.ir/radioiran/live/playlist.m3u8'}

],

ifilm:[

{name:'iFilm Farsi',url:'https://live.presstv.ir/hls/ifilmfa.m3u8'},
{name:'iFilm Dari',url:'https://live.presstv.ir/hls/ifilm2.m3u8'},
{name:'iFilm English',url:'https://live.presstv.ir/hls/ifilmen.m3u8'},
{name:'iFilm Arabic',url:'https://live.presstv.ir/hls/ifilmar.m3u8'}

]

};

function render(filter){

currentFilter = filter;

const container =
document.getElementById('channelContainer');

let html = '';

for(const cat in channels){

if(filter && filter !== cat){
continue;
}

html += `
<div class="category-title">
${cat.toUpperCase()}
</div>
`;

channels[cat].forEach(ch=>{

html += `
<div class="channel-item"
onclick="play('${ch.url}','${ch.name}')">
${ch.name}
</div>
`;

});

}

container.innerHTML = html;

}

function play(url,name){

current = {url,name};

document.getElementById('title').innerText = name;

if(hls){

try{
hls.destroy();
}catch(e){}

}

const wrap =
document.getElementById('playerWrap');

wrap.innerHTML = `
<div class="error-msg">
<div class="spinner"></div>
<div>Laddar ${name}...</div>
</div>
`;

setTimeout(()=>{

wrap.innerHTML = `
<video
id="video"
controls
autoplay
playsinline
webkit-playsinline
x5-playsinline>
</video>
`;

const video =
document.getElementById('video');

if(Hls.isSupported() && !isiOS){

hls = new Hls({

enableWorker:false,
lowLatencyMode:false,

maxBufferLength:10,
maxMaxBufferLength:20,
maxBufferSize:20*1000*1000,

fragLoadingMaxRetry:5,
manifestLoadingMaxRetry:5,
levelLoadingMaxRetry:5,

startLevel:0

});

hls.loadSource(url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

video.play().catch(()=>{});

});

}else{

video.src = url;

video.muted = true;

const p = video.play();

if(p !== undefined){

p.then(()=>{

video.muted = false;

}).catch(()=>{});

}

}

},300);

}

function reload(){

if(current){

play(current.url,current.name);

}

}

function fullscreenPlayer(){

const video =
document.getElementById('video');

if(video){

if(video.requestFullscreen){

video.requestFullscreen();

}

}

}

function showAll(btn){

document.querySelectorAll('.nav-btn')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

render(null);

}

function filterCategory(btn,cat){

document.querySelectorAll('.nav-btn')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

render(cat);

}

render();

</script>

</body>
</html>
