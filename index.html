* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; min-height: 100vh; }
.header { background: rgba(0,0,0,0.4); padding: 18px 20px; text-align: center; border-bottom: 1px solid rgba(78,204,163,0.3); }
.header h1 { font-size: 2em; color: #4ecca3; margin-bottom: 6px; }
.header p { opacity: 0.8; font-size: 0.9rem; }
.nav-buttons { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; background: rgba(0,0,0,0.2); }
.nav-btn { background: #1e2f3f; color: #e0e0e0; border: none; padding: 8px 18px; border-radius: 40px; cursor: pointer; font-weight: 600; font-size: 0.85rem; -webkit-appearance: none; }
.nav-btn.active, .nav-btn:hover { background: #4ecca3; color: #0a1c2a; }
.container { display: flex; min-height: calc(100vh - 180px); padding: 16px; gap: 16px; }
.channel-list { width: 270px; background: rgba(0,0,0,0.45); overflow-y: auto; border-radius: 20px; padding: 12px; -webkit-overflow-scrolling: touch; }
.video-container { flex: 1; background: #03090e; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2c5f6e; }
.video-header { background: rgba(0,0,0,0.7); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid rgba(78,204,163,0.3); }
.video-title { font-size: 1.1rem; font-weight: bold; color: #4ecca3; }
.video-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: #1f3e48; color: white; border: none; padding: 7px 14px; border-radius: 40px; cursor: pointer; font-size: 0.82rem; font-weight: 600; -webkit-appearance: none; }
.btn:active { background: #4ecca3; color: #0a1c2a; }
.video-wrapper { flex: 1; position: relative; background: #000; min-height: 220px; display: flex; align-items: center; justify-content: center; }
video { width: 100%; height: 100%; background: black; display: block; }
.error-msg { text-align: center; padding: 30px; color: #ffbb99; }
.category-title { font-weight: 700; font-size: 1rem; padding: 10px 6px 6px 6px; color: #4ecca3; border-bottom: 2px solid #4ecca3; margin: 10px 0 6px 0; }
.subgroup-title { font-weight: 600; font-size: 0.78rem; padding: 6px 8px 4px 8px; color: #a8e6d2; border-left: 3px solid #4ecca3; margin: 8px 0 4px 4px; text-transform: uppercase; background: rgba(78,204,163,0.07); border-radius: 0 8px 8px 0; }
.channel-item { padding: 9px 12px; margin: 5px 0; cursor: pointer; border-radius: 18px; font-size: 0.88rem; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); -webkit-tap-highlight-color: rgba(78,204,163,0.3); user-select: none; }
.channel-item.blue { background: rgba(0,100,220,0.65); }
.channel-item.active { box-shadow: 0 0 0 2px #4ecca3; font-weight: bold; }
.fav-btn { background: none; border: none; color: #ffd966; font-size: 1.1rem; padding: 2px 6px; cursor: pointer; }
.js-toggle-off { background: #c95a2e !important; }
.close-btn { display: none; position: fixed; top: 16px; right: 16px; z-index: 1001; background: #dc3545; color: white; border: none; padding: 10px 18px; border-radius: 40px; cursor: pointer; font-weight: bold; }

/* Noscript - fullscreen channel list with native links */
noscript .ns-wrap { padding: 16px; }
noscript .ns-title { color: #4ecca3; font-size: 1.1rem; font-weight: bold; margin: 12px 0 6px 0; border-bottom: 2px solid #4ecca3; padding-bottom: 4px; }
noscript .ns-sub { color: #a8e6d2; font-size: 0.78rem; text-transform: uppercase; margin: 8px 0 4px 8px; border-left: 3px solid #4ecca3; padding-left: 8px; background: rgba(78,204,163,0.07); border-radius: 0 6px 6px 0; }
noscript a.ns-ch { display: block; padding: 9px 12px; margin: 4px 0; border-radius: 16px; background: rgba(255,255,255,0.1); color: #fff; text-decoration: none; font-size: 0.88rem; }
noscript a.ns-ch.blue { background: rgba(0,100,220,0.65); }
noscript .ns-info { background: rgba(78,204,163,0.15); border: 1px solid #4ecca3; border-radius: 12px; padding: 14px; margin: 12px 0; font-size: 0.85rem; line-height: 1.6; }
noscript video { width: 100%; border-radius: 12px; }

@media (max-width: 768px) {
  .container { flex-direction: column; }
  .channel-list { width: 100%; position: fixed; left: 0; top: 0; width: 85%; max-width: 300px; height: 100%; z-index: 1000; border-radius: 0 20px 20px 0; padding: 20px; transform: translateX(-100%); transition: transform 0.25s ease; overflow-y: auto; background: #0a1c28f2; -webkit-overflow-scrolling: touch; }
  .channel-list.show { transform: translateX(0); }
  .close-btn { display: block; }
}
</style>

// ---- Order persistence ----
function loadOrder(cat) {
  try { var o = localStorage.getItem('order_' + cat); return o ? JSON.parse(o) : null; } catch(e){ return null; }
}
function saveOrder(cat, arr) {
  try { localStorage.setItem('order_' + cat, JSON.stringify(arr.map(function(c){return c.url;}))); } catch(e){}
}
function applyStoredOrder(flat, catKey) {
  var stored = loadOrder(catKey);
  if (!stored || !stored.length) return flat;
  var map = {};
  flat.forEach(function(c){ map[c.url] = c; });
  var ordered = [];
  stored.forEach(function(url){ if(map[url]) ordered.push(map[url]); });
  flat.forEach(function(c){ if(ordered.indexOf(c) === -1) ordered.push(c); });
  return ordered;
}

function buildTelewebionFlat() {
  var flat = [];
  subgroups.telewebion.forEach(function(sg){
    sg.channels.forEach(function(ch){
      flat.push({ name: ch.name, url: ch.url, icon: ch.icon, subgroup: sg.key });
    });
  });
  return flat;
}

var telewebionFlat = applyStoredOrder(buildTelewebionFlat(), 'telewebion');
var ifilmOrdered = applyStoredOrder(ifilmRaw.slice(), 'ifilm');
var channels = { telewebion: telewebionFlat, ifilm: ifilmOrdered };

function reorderCategory(catKey, newArr) {
  channels[catKey] = newArr;
  saveOrder(catKey, newArr);
}

// ---- Player state ----
var hlsInst = null;
var cur = null;
var favs = [];
try { favs = JSON.parse(localStorage.getItem('xomfavs') || '[]'); } catch(e){ favs = []; }
var curFilter = null;
var curSubgroup = null;
var dragSource = null;
var stallTimer = null;
var retryCount = 0;
var retryTimer = null;
var lastTime = -1;
var lastTimeStamp = Date.now();

// ---- Helpers ----
function esc(s) {
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function destroyPlayers() {
  clearStallWatcher();
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (hlsInst) { try { hlsInst.destroy(); } catch(e){} hlsInst = null; }
  retryCount = 0;
}

function startStallWatcher(vid) {
  clearStallWatcher();
  lastTime = -1;
  lastTimeStamp = Date.now();
  stallTimer = setInterval(function() {
    if (!vid || vid.paused || vid.ended || vid.readyState < 2) return;
    var now = Date.now();
    var t = vid.currentTime;
    if (t === lastTime) {
      var stalledFor = (now - lastTimeStamp) / 1000;
      if (stalledFor >= 4) {
        try {
          var ranges = vid.buffered;
          if (ranges.length > 0) {
            var end = ranges.end(ranges.length - 1);
            if (end - t > 0.5) vid.currentTime = end - 0.3;
          }
        } catch(e) {}
        if (hlsInst) { try { hlsInst.startLoad(); } catch(e) {} }
        vid.play().catch(function(){});
      }
      if (stalledFor >= 14) softReconnect();
    } else {
      lastTime = t;
      lastTimeStamp = now;
    }
  }, 1000);
}

function clearStallWatcher() {
  if (stallTimer) { clearInterval(stallTimer); stallTimer = null; }
}

function softReconnect() {
  if (!cur || !hlsInst) return;
  try {
    hlsInst.stopLoad();
    setTimeout(function() {
      if (!hlsInst) return;
      hlsInst.loadSource(cur.url);
      hlsInst.startLoad(-1);
      var vid = document.getElementById('vplayer');
      if (vid) vid.play().catch(function(){});
      lastTime = -1;
      lastTimeStamp = Date.now();
    }, 800);
  } catch(e) {}
}

function scheduleRetry(url, name) {
  if (retryTimer) clearTimeout(retryTimer);
  var delay = Math.min(1000 * Math.pow(1.5, retryCount), 15000);
  retryCount++;
  retryTimer = setTimeout(function() {
    if (cur && cur.url === url) playInternal(url, name);
  }, delay);
}

// ---- Render ----
function render(filter, sgFilter) {
  curFilter = filter;
  curSubgroup = sgFilter;

  function chRow(ch, idx, catKey) {
    var star = favs.some(function(f){ return f.url===ch.url; }) ? '⭐' : '☆';
    var activeClass = (cur && cur.url===ch.url) ? 'active' : '';
    var colorClass = ch.color || '';
    return '<div class="channel-item ' + colorClass + ' ' + activeClass + '" draggable="true"' +
      ' data-url="' + esc(ch.url) + '"' +
      ' data-name="' + esc(ch.name) + '"' +
      ' data-cat="' + catKey + '"' +
      ' data-idx="' + idx + '">' +
      '<span>' + (ch.icon ? ch.icon + ' ' : '') + ch.name + '</span>' +
      '<button class="fav-btn" onclick="event.stopPropagation();fav(\'' + esc(ch.url) + '\',\'' + esc(ch.name) + '\')">' + star + '</button>' +
      '</div>';
  }

  var html = '';

  if (filter === 'telewebion' || !filter) {
    var catArr = channels.telewebion;
    var sgMap = {};
    subgroups.telewebion.forEach(function(sg){ sgMap[sg.key] = { label: sg.label, items: [] }; });
    catArr.forEach(function(ch, idx){
      var sgKey = ch.subgroup || 'sarasari';
      if (sgMap[sgKey]) sgMap[sgKey].items.push({ ch: ch, idx: idx });
    });

    if (sgFilter) {
      var sg = sgMap[sgFilter];
      if (sg && sg.items.length > 0) {
        html += '<div class="category-title">' + sg.label + ' (' + sg.items.length + ')</div>';
        sg.items.forEach(function(item){ html += chRow(item.ch, item.idx, 'telewebion'); });
      }
    } else {
      html += '<div class="category-title">📡 Telewebion (' + catArr.length + ')</div>';
      subgroups.telewebion.forEach(function(sgDef){
        var sg = sgMap[sgDef.key];
        if (!sg || sg.items.length === 0) return;
        html += '<div class="subgroup-title">' + sg.label + '</div>';
        sg.items.forEach(function(item){ html += chRow(item.ch, item.idx, 'telewebion'); });
      });
    }
  }

  if ((filter === 'ifilm' || !filter) && !sgFilter) {
    var catArr2 = channels.ifilm;
    html += '<div class="category-title">🎬 iFilm (' + catArr2.length + ')</div>';
    catArr2.forEach(function(ch, i){ html += chRow(ch, i, 'ifilm'); });
  }

  document.getElementById('ch-container').innerHTML = html;
  attachDragListeners();
  attachChannelEvents();
}

function attachChannelEvents() {
  var items = document.querySelectorAll('.channel-item');
  for (var i = 0; i < items.length; i++) {
    (function(el) {
      el.addEventListener('click', function(ev) {
        if (ev.target.classList.contains('fav-btn')) return;
        play(el.dataset.url, el.dataset.name);
      });
    })(items[i]);
  }
}

// ---- Drag & Drop ----
function attachDragListeners() {
  var items = document.querySelectorAll('.channel-item[draggable="true"]');
  for (var i = 0; i < items.length; i++) {
    items[i].addEventListener('dragstart', dragStart);
    items[i].addEventListener('dragend', dragEnd);
    items[i].addEventListener('dragover', dragOver);
    items[i].addEventListener('dragleave', dragLeave);
    items[i].addEventListener('drop', drop);
  }
}

function dragStart(e) {
  dragSource = e.target.closest ? e.target.closest('.channel-item') : e.currentTarget;
  if (!dragSource) return;
  e.dataTransfer.setData('text/plain', 'drag');
  e.dataTransfer.effectAllowed = 'move';
  dragSource.style.opacity = '0.5';
}
function dragEnd() {
  if (dragSource) dragSource.style.opacity = '';
  cleanupDrag();
}
function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var target = e.target.closest ? e.target.closest('.channel-item') : e.currentTarget;
  if (target && target !== dragSource) target.classList.add('drag-over');
}
function dragLeave(e) {
  var target = e.target.closest ? e.target.closest('.channel-item') : e.currentTarget;
  if (target) target.classList.remove('drag-over');
}
function drop(e) {
  e.preventDefault();
  var targetItem = e.target.closest ? e.target.closest('.channel-item') : e.currentTarget;
  if (!dragSource || !targetItem || dragSource === targetItem) { cleanupDrag(); return; }
  var srcCat = dragSource.dataset.cat;
  var tgtCat = targetItem.dataset.cat;
  if (srcCat !== tgtCat) { cleanupDrag(); return; }
  var srcIdx = parseInt(dragSource.dataset.idx, 10);
  var tgtIdx = parseInt(targetItem.dataset.idx, 10);
  if (isNaN(srcIdx) || isNaN(tgtIdx)) { cleanupDrag(); return; }
  var arr = channels[srcCat].slice();
  var moved = arr.splice(srcIdx, 1)[0];
  arr.splice(tgtIdx, 0, moved);
  reorderCategory(srcCat, arr);
  render(curFilter, curSubgroup);
  cleanupDrag();
}
function cleanupDrag() {
  if (dragSource) dragSource.style.opacity = '';
  var items = document.querySelectorAll('.channel-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('drag-over');
  dragSource = null;
}

// ---- Play ----
function play(url, name) {
  if (window.innerWidth <= 768) {
    var cl = document.getElementById('channel-list');
    if (cl) cl.classList.remove('show');
  }
  cur = { url: url, name: name };
  retryCount = 0;
  document.getElementById('ch-title').textContent = name;
  destroyPlayers();
  var wrap = document.getElementById('vwrap');
  wrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:20px;"><span>Laddar ' + name + '…</span></div>';
  render(curFilter, curSubgroup);
  setTimeout(function(){ playInternal(url, name); }, 50);
}

function playInternal(url, name) {
  var wrap = document.getElementById('vwrap');
  if (!wrap) return;

  // Create or reuse video element
  var vid = document.getElementById('vplayer');
  if (!vid) {
    wrap.innerHTML = '<video id="vplayer" controls autoplay playsinline webkit-playsinline style="width:100%;height:100%;max-height:60vh;"></video>';
    vid = document.getElementById('vplayer');
  }

  // Visibility recovery
  document.removeEventListener('visibilitychange', onVisibilityChange);
  document.addEventListener('visibilitychange', onVisibilityChange);

  // Try HLS.js first (not supported on iOS anyway, but for desktop/Android)
  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    if (hlsInst) { try { hlsInst.destroy(); } catch(e){} hlsInst = null; }
    hlsInst = new Hls({
      enableWorker: true,
      maxBufferLength: 60,
      maxMaxBufferLength: 300,
      maxBufferHole: 2.0,
      liveSyncDurationCount: 8,
      liveMaxLatencyDurationCount: 20,
      liveDurationInfinity: true,
      fragLoadingMaxRetry: 20,
      fragLoadingRetryDelay: 500,
      manifestLoadingMaxRetry: 20,
      manifestLoadingRetryDelay: 500,
      levelLoadingMaxRetry: 20,
      levelLoadingRetryDelay: 500,
      startLevel: -1,
      autoStartOnStall: true,
      nudgeMaxRetry: 10,
      nudgeOffset: 0.2
    });
    hlsInst.loadSource(url);
    hlsInst.attachMedia(vid);
    hlsInst.on(Hls.Events.MANIFEST_PARSED, function() {
      vid.play().catch(function(err){ console.warn(err); });
      startStallWatcher(vid);
      retryCount = 0;
    });
    hlsInst.on(Hls.Events.ERROR, function(ev, d) {
      if (!d.fatal) {
        if (d.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR ||
            d.details === Hls.ErrorDetails.BUFFER_NUDGE_ON_STALL) {
          try { hlsInst.startLoad(); } catch(e) {}
          vid.play().catch(function(){});
        }
        return;
      }
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        scheduleRetry(url, name);
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { hlsInst.recoverMediaError(); } catch(e) {}
        setTimeout(function(){ if (hlsInst) hlsInst.swapAudioCodec(); }, 500);
        setTimeout(function(){ if (hlsInst) hlsInst.recoverMediaError(); }, 1000);
      } else {
        scheduleRetry(url, name);
      }
    });
    hlsInst.on(Hls.Events.LEVEL_LOADED, function(){ retryCount = 0; });

  } else if (vid.canPlayType('application/vnd.apple.mpegurl') || vid.canPlayType('application/x-mpegURL')) {
    // Native HLS – Safari on iOS/macOS
    // IMPORTANT for iPhone 5s: use src attribute directly, not via JS assignment, and set playsinline
    vid.setAttribute('src', url);
    vid.load();

    vid.addEventListener('error', function() {
      scheduleRetry(url, name);
    }, { once: true });

    vid.addEventListener('stalled', function() {
      setTimeout(function() {
        vid.load();
        vid.play().catch(function(){});
      }, 1500);
    });

    vid.addEventListener('waiting', function() {
      setTimeout(function() {
        vid.play().catch(function(){});
      }, 800);
    });

    vid.addEventListener('canplay', function() {
      vid.play().catch(function(){});
      startStallWatcher(vid);
    }, { once: true });

    // Fallback play attempt
    var playPromise = vid.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch(function() {
        // On iOS autoplay may be blocked - video still shows with controls
        startStallWatcher(vid);
      });
    }

  } else {
    wrap.innerHTML = '<div class="error-msg"><h3>⚠️ HLS stöds inte av denna webbläsare</h3><p>Prova att öppna länken direkt:</p>' +
      '<a href="' + url + '" style="color:#4ecca3;word-break:break-all;">' + url + '</a></div>';
  }
}

function onVisibilityChange() {
  if (document.visibilityState === 'visible' && cur) {
    var vid = document.getElementById('vplayer');
    if (!vid) return;
    if (vid.paused || vid.readyState < 2) {
      if (hlsInst) { try { hlsInst.startLoad(); } catch(e) {} }
      vid.play().catch(function(){ softReconnect(); });
    }
  }
}

// ---- Controls ----
function reload() {
  if (cur) { retryCount = 0; play(cur.url, cur.name); }
}
function pip() {
  var v = document.getElementById('vplayer');
  if (v && document.pictureInPictureEnabled) {
    if (document.pictureInPictureElement) document.exitPictureInPicture();
    else v.requestPictureInPicture().catch(function(){});
  }
}
function fs() {
  var w = document.getElementById('vwrap');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (w.requestFullscreen) w.requestFullscreen().catch(function(){});
  else if (w.webkitRequestFullscreen) w.webkitRequestFullscreen(); // Safari/iOS
}
function toggleList() {
  var cl = document.getElementById('channel-list');
  if (cl) cl.classList.toggle('show');
}
function fav(url, name) {
  var i = -1;
  favs.forEach(function(f, idx){ if (f.url === url) i = idx; });
  if (i > -1) favs.splice(i, 1);
  else favs.push({ url: url, name: name });
  try { localStorage.setItem('xomfavs', JSON.stringify(favs)); } catch(e){}
  render(curFilter, curSubgroup);
}
function showAll(btn) {
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render(null, null);
}
function filterCat(btn, cat) {
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  curSubgroup = null;
  render(cat, null);
}
function filterSubgroup(btn, sgKey) {
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render('telewebion', sgKey);
}

// ---- Init ----
render(null, null);
